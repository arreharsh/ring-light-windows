<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ring Light Overlay</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }

      /* Root ring wrapper */
      .ring {
        position: fixed;
        inset: 0;
        padding: var(--ring-gap, 120px);
        pointer-events: none;
        opacity: var(--opacity, 0.95);
      }
      /* Ring element */
      .ring::after {
        content: "";
        position: absolute;
        inset: 0;

        border-radius: calc(72px + var(--ring-thickness) * 0.6);


        box-shadow: 0 0 18px rgba(var(--light-rgb), 0.45),
          0 0 48px rgba(var(--light-rgb), 0.25),
          0 0 90px rgba(var(--light-rgb), 0.12);

        pointer-events: none;
      }

      .ring::before {
        content: "";
        position: absolute;
        inset: 0;

        background: rgba(var(--light-rgb), 1);

        border-radius: calc(72px + var(--ring-thickness) * 0.6);

        padding: var(--ring-thickness, 28px);

        -webkit-mask: linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;

        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        box-shadow: inset 0 0 16px rgba(var(--light-rgb), 0.25),
          0 0 0 1px rgba(var(--light-rgb), 0.95);
      }
    </style>
  </head>

  <body>
    <div class="ring"></div>

    <script>
      const { ipcRenderer } = require("electron");

      let settings = {
        brightness: 80,
        temperature: 40,
        size: 60,
        isOn: true,
      };

      function getColor(temp) {
        const r = Math.round(235 + temp * 0.4);
        const g = Math.round(240 + temp * 0.2);
        const b = Math.round(255 - temp * 0.6);
        return { r, g, b };
      }

      function updateOverlay() {
        const { r, g, b } = getColor(settings.temperature);

        const gap = 80 + (100 - settings.size) * 1.4; // inner space
        const thickness = 50 + settings.size * 0.3; // ring thickness
        const opacity = settings.isOn ? settings.brightness / 100 : 0;

        document.documentElement.style.setProperty(
          "--light-rgb",
          `${r},${g},${b}`
        );
        document.documentElement.style.setProperty("--ring-gap", `${gap}px`);
        document.documentElement.style.setProperty(
          "--ring-thickness",
          `${thickness}px`
        );
        document.documentElement.style.setProperty("--opacity", opacity);
      }

      ipcRenderer.on("settings-changed", (_, newSettings) => {
        settings = { ...settings, ...newSettings };
        updateOverlay();
      });

      updateOverlay();
    </script>
  </body>
</html>
